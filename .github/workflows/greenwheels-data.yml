name: Greenwheels data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greenwheels-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Greenwheels feeds
        run: |
          mkdir -p out
          node .github/scripts/greenwheels-data.mjs out/greenwheels.json

      - name: Publish to greenwheels-data branch
        run: |
          cd out
          git init -q -b greenwheels-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenwheels.json
          git commit -q -m "Greenwheels data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" greenwheels-data
